<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
    <linearGradient id="rocketFin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Rocket Flame Trail -->
  <g filter="url(#shadow)">
    <path d="M190 322 C 160 380, 130 420, 100 450 C 145 425, 185 395, 235 370 Z" fill="url(#flame)" opacity="0.9" />
    <path d="M175 340 C 150 390, 130 415, 115 435 C 145 415, 175 395, 205 375 Z" fill="#FEF08A" />
  </g>

  <!-- Rocket Group -->
  <g filter="url(#shadow)" transform="translate(15, -15)">
    <!-- Left Fin -->
    <path d="M195 270 L 155 330 C 145 350, 140 375, 135 390 C 155 385, 180 380, 200 370 L 255 330 Z" fill="url(#rocketFin)" />
    <!-- Right Fin -->
    <path d="M295 170 L 355 210 C 375 220, 400 225, 415 230 C 410 210, 405 185, 395 165 L 335 125 Z" fill="url(#rocketFin)" />

    <!-- Rocket Main Fuselage -->
    <path d="M380 90 C 270 120, 215 190, 195 275 C 245 325, 305 345, 390 325 C 410 245, 480 190, 510 80 C 470 70, 420 75, 380 90 Z" transform="translate(-100, 30)" fill="url(#rocketBody)" />

    <!-- Rocket Window / Cockpit -->
    <circle cx="310" cy="180" r="32" fill="#3B82F6" stroke="#93C5FD" stroke-width="8" />
    <circle cx="318" cy="172" r="10" fill="#FFFFFF" opacity="0.8" />

    <!-- Speed Accent / Star Sparkle -->
    <path d="M390 80 L 400 105 L 425 115 L 400 125 L 390 150 L 380 125 L 355 115 L 380 105 Z" fill="#FDE047" />
    <circle cx="160" cy="130" r="12" fill="#FFFFFF" opacity="0.7" />
    <circle cx="410" cy="380" r="16" fill="#FFFFFF" opacity="0.7" />
  </g>
</svg>
